# TaotieCat Mihomo universal overlay - integrated edition (2026-11-13)
# This is a config OVERLAY, requiring proxy-providers.Airport from base config.
# Replace (do not append) proxy-groups, rule-providers and rules arrays in the client.
# User custom Emby upstream Emby.yaml is actually PLAIN TEXT rules: format: text is intentional.
# Upstream Emby.yaml currently includes a whitespace typo: DOMAIN-SUFFIX, mobaiemby.site.
# Please correct that GitHub source line to DOMAIN-SUFFIX,mobaiemby.site.
# AIGC consolidated source is Surge classical TEXT; broad third-party domains may also match AI.
# Financial and Apple rules are deliberately placed BEFORE AIGC.
# PC Mihomo has no iOS include-apns option; Apple general domains use DIRECT here.
# Automated US-R residential group can change IP; lock an actual node for bank use.
# Custom software REJECT rules are preserved unchanged from original.
# Keep MATCH last after the client merges this overlay.

proxy-groups:
- name: 全球加速
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 日本节点
  - 美国节点
  - 美国家宽
  - 德国节点
  - 英国节点
  - 狮城节点
- name: 国际媒体
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 日本节点
  - 美国节点
  - 美国家宽
  - 德国节点
  - 英国节点
  - 狮城节点
  - 马来节点
- name: Emby服务
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 日本节点
  - 美国节点
  - 狮城节点
  - 德国节点
  - 马来节点
- name: AI分流
  type: select
  proxies:
  - 美国家宽
  - 美国节点
  - 自动选择
- name: 社交链路
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 美国家宽
  - 美国节点
  - 日本节点
  - 德国节点
  - 英国节点
  - 狮城节点
- name: 自动选择
  type: url-test
  use:
  - Airport
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 香港节点
  type: url-test
  use:
  - Airport
  filter: (?i)港|香港|HK|Hong
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 日本节点
  type: url-test
  use:
  - Airport
  filter: (?i)日|东京|JP|Japan
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 美国节点
  type: url-test
  use:
  - Airport
  filter: (?i)美|US|States|American
  exclude-filter: (?i)US-R-
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 美国家宽
  type: url-test
  use:
  - Airport
  filter: (?i)US-R-
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 狮城节点
  type: url-test
  use:
  - Airport
  filter: (?i)新|坡|SG|Singapore
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 德国节点
  type: url-test
  use:
  - Airport
  filter: (?i)德|DE|Germany
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 英国节点
  type: url-test
  use:
  - Airport
  filter: (?i)UK|GB|Britain|London|英国|英格兰
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 马来节点
  type: url-test
  use:
  - Airport
  filter: (?i)马来|MY|Malaysia
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
